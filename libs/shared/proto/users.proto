syntax = "proto3";

package users;

service UsersService {
  rpc GetUser(GetUserRequest)
      returns (UserDetailResponse);

  rpc GetAddresses(GetAddressesRequest)
      returns (GetAddressesResponse);

  rpc GetDefaultAddress(GetDefaultAddressRequest)
      returns (GetDefaultAddressResponse);

  rpc GetAddressById(GetAddressByIdRequest)
      returns (GetAddressByIdResponse);

  rpc GetUserByIdentityId(GetUserByIdentityIdRequest)
      returns (GetUserByIdentityIdResponse);

  rpc SearchUsers(SearchUsersRequest)
      returns (SearchUsersResponse);

  rpc UpdateProfile(UpdateProfileRequest)
      returns (MutationResponse);

  rpc UpdateAvatar(UpdateAvatarRequest)
      returns (MutationResponse);

  rpc AddAddress(AddAddressRequest)
      returns (MutationResponse);

  rpc UpdateAddress(UpdateAddressRequest)
      returns (MutationResponse);

  rpc RemoveAddress(RemoveAddressRequest)
      returns (MutationResponse);

  rpc SetDefaultAddress(SetDefaultAddressRequest)
      returns (MutationResponse);
}

message GetUserRequest {
  string userId = 1;
}

message GetAddressesRequest {
  string userId = 1;
}

message GetDefaultAddressRequest {
  string userId = 1;
}

message GetAddressByIdRequest {
  string userId = 1;
  string addressId = 2;
}

message GetUserByIdentityIdRequest {
  string identityId = 1;
}

message SearchUsersRequest {
  string query = 1;
  int32 page = 2;
  int32 limit = 3;
}

message UpdateProfileRequest {
  string userId = 1;
  string firstName = 2;
  string lastName = 3;
  string phoneNumber = 4;
  string gender = 5;
  string birthday = 6;
}

message UpdateAvatarRequest {
  string userId = 1;
  string avatarUrl = 2;
}

message AddAddressRequest {
  string userId = 1;
  string firstName = 2;
  string lastName = 3;
  string phoneNumber = 4;
  string provinceCode = 5;
  string districtCode = 6;
  string districtName = 7;
  string wardCode = 8;
  string addressLine = 9;
  string postalCode = 10;
  string label = 11;
  bool isDefault = 12;
}

message UpdateAddressRequest {
  string userId = 1;
  string addressId = 2;
  string firstName = 3;
  string lastName = 4;
  string phoneNumber = 5;
  string provinceCode = 6;
  string districtCode = 7;
  string districtName = 8;
  string wardCode = 9;
  string addressLine = 10;
  string postalCode = 11;
  string label = 12;
}

message RemoveAddressRequest {
  string userId = 1;
  string addressId = 2;
}

message SetDefaultAddressRequest {
  string userId = 1;
  string addressId = 2;
}

message MutationResponse {
  bool success = 1;
}

message AddressResponse {
  string id = 1;
  string receiverName = 2;
  string phoneNumber = 3;
  string provinceCode = 4;
  string districtCode = 5;
  string wardCode = 6;
  string addressLine = 7;
  string postalCode = 8;
  string label = 9;
  bool isDefault = 10;
}

message UserDetailResponse {
  string id = 1;
  string identityId = 2;
  string fullName = 3;
  string email = 4;
  string avatarUrl = 5;
  string phoneNumber = 6;
  string gender = 7;
  string birthday = 8;
  repeated AddressResponse addresses = 9;
  string createdAt = 10;
  string updatedAt = 11;
}

message GetAddressesResponse {
  repeated AddressResponse addresses = 1;
}

message GetDefaultAddressResponse {
  AddressResponse address = 1;
}

message GetAddressByIdResponse {
  AddressResponse address = 1;
}

message GetUserByIdentityIdResponse {
  UserDetailResponse user = 1;
}

message UserListItemResponse {
  string id = 1;
  string fullName = 2;
  string email = 3;
  string phoneNumber = 4;
  string avatarUrl = 5;
  string createdAt = 6;
}

message SearchUsersResponse {
  repeated UserListItemResponse users = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}
